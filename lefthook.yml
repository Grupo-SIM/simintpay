assert_lefthook_installed: true
commit-msg:
  commands:
    commitlint:
      run: bunx --no-install commitlint --edit {1}
pre-commit:
  parallel: false
  commands:
    1-types:
      run: bun scripts/validate-staged.ts
    2-format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,css,yml,yaml,md}'
      run: bun scripts/format-staged.ts {staged_files}
      stage_fixed: true
    3-lint:
      glob: '**/*.{ts,tsx,js,jsx,mjs}'
      run: bun scripts/lint-staged.ts {staged_files}
      stage_fixed: true
    4-unit:
      glob: 'backend/src/**/*.ts'
      run: bunx --no-install turbo run test:unit --filter backend
    5-checkout-unit:
      glob: 'checkout/src/**/*.{ts,tsx}'
      run: bunx --no-install turbo run test:unit --filter checkout
