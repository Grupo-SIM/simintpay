assert_lefthook_installed: true
commit-msg:
  commands:
    commitlint:
      run: bun x --no-install commitlint --edit {1}
pre-commit:
  parallel: false
  commands:
    1-format:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,css,yml,yaml,md}'
      run: bun scripts/format-staged.ts {staged_files}
      stage_fixed: true
    2-lint:
      glob: '**/*.{ts,tsx,js,jsx,mjs}'
      run: bun scripts/lint-staged.ts {staged_files}
      stage_fixed: true
    3-check:
      run: bun scripts/validate-staged.ts
