name: simintpay-production
x-backend-image: &backend-image ${BACKEND_IMAGE:-ghcr.io/grupo-sim/simintpay-back_backend:latest}
x-after-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  migrate:
    image: *backend-image
    env_file: .env
    init: true
    restart: 'no'
    working_dir: /app/backend
    command:
      ['node', '../node_modules/prisma/build/index.js', 'migrate', 'deploy']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    <<: *after-migrate
    image: *backend-image
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: '3333'
    init: true
    restart: unless-stopped
    ports: ['127.0.0.1:3333:3333']
    volumes: [storage:/app/backend/storage]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  checkout:
    image: ${CHECKOUT_IMAGE:?Set CHECKOUT_IMAGE to an immutable image tag}
    init: true
    restart: unless-stopped
    ports: ['127.0.0.1:3000:3000']
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/grupo-sim/simintpay-back_frontend:latest}
    restart: unless-stopped
    env_file: [./frontend/.env.production]
    ports: ['${FRONTEND_PORT:-3002}:3000']
    depends_on: [api]
volumes:
  storage:
    name: ${STORAGE_VOLUME_NAME:-back-simpay_simpay_storage}
    external: true
