version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: simintpay
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_donate:
    image: brenolima1706/back-simpay:latest
    networks:
      - externa
      - default
    environment:
      # --- CORE & AUTH ---
      - RABBITMQ_URL=amqp://simintpay:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672
      - PORT=3333
      - NODE_ENV=production
      - PLATFORM_CONFIG_ENCRYPTION_KEY=${PLATFORM_CONFIG_ENCRYPTION_KEY:?Set PLATFORM_CONFIG_ENCRYPTION_KEY}
      - TZ=America/Fortaleza
      - JWT_SECRET=secret
      - JWT_DRIVER=jsonwebtoken
      - HASH_DRIVER=bcrypt
      - URL_APP=https://simpay-back.simintermediacoes.com
      - FRONTEND_URL=https://simintpay.com
      - INTERNAL_SERVICE_TOKEN=91b324f6aa36368c536b4f1f9e75f7565b385737b1aa3a4adf07b8c7d99300c9
      - API_MACHINE_INTERNAL_TOKEN=91b324f6aa36368c536b4f1f9e75f7565b385737b1aa3a4adf07b8c7d99300c9
      - API_MACHINE_URL=https://simpay-back.simintermediacoes.com
      - SIMPAY_WEBHOOK_TOKEN=91b324f6aa36368c536b4f1f9e75f7565b385737b1aa3a4adf07b8c7d99300c9
      - WEBHOOK_SECRET=simpay-bff-webhook-secret-change-me-in-production-64chars-minimum-ok
      - DOM_WEBHOOK_SECRET=simpay-webhook-secret-renovada-change-me-in-production

      # --- DB & REDIS ---
      - DATABASE_URL=postgresql://postgres:pUXSu1qNwOgl4It@postgres_prod:5432/simpay
      - DIRECT_URL=postgresql://postgres:pUXSu1qNwOgl4It@postgres_prod:5432/simpay
      - REDIS_HOST=redis_renovada
      - REDIS_PORT=6379

      # --- GATEWAYS & EXTERNAL ---
      - API_DOM_MASTER_KEY=55ac4cdab8adb226e043596d3faedaab9266c95d878f592a4fc12f0c4a2e7de1
      - API_DOM_URL=
      - DOM_TOKEN=55ac4cdab8adb226e043596d3faedaab9266c95d878f592a4fc12f0c4a2e7de1
      - DOM_BACKEND_URL=https://api-dom.jbmidia.com
      - DOM_REAL_API_URL=https://apiv3.dompagamentos.com.br/checkout/production
      - DISABLE_DOM_SYNC=false

      # --- STORAGE & SMTP ---
      - SMTP_HOST=mail.jbmidia.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=noreply@jbmidia.com
      - SMTP_PASSWORD=j0M$$s5e55
      - SMTP_FROM_EMAIL=noreply@jbmidia.com
      - STORJ_ACCESS_KEY=jwedqlbin4rklmmkvqtzaqbkdncq
      - STORJ_SECRET_KEY=j3khsrqjvyypuuuh7ywyk64uyzuphychv4s3trddjjt6f74tmxr3y
      - STORJ_BUCKET=ebook
      - STORJ_REGION=US1
      - STORJ_ENDPOINT=https://gateway.storjshare.io
      - AWS_ACCESS_KEY_ID=jwedqlbin4rklmmkvqtzaqbkdncq
      - AWS_SECRET_ACCESS_KEY=j3khsrqjvyypuuuh7ywyk64uyzuphychv4s3trddjjt6f74tmxr3y

      # --- ADMIN SEED ---
      - MASTER_ADMIN_EMAILS=adminljl@simpay.com.br
      - SEED_ADMIN_EMAIL=adminljl@simpay.com.br
      - SEED_ADMIN_NAME=Admin
      - SEED_ADMIN_PASSWORD=xGzHA44e6L8

    volumes:
      - simpay_storage:/app/storage
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.back-simpay.entrypoints=websecure"
        - "traefik.http.routers.back-simpay.rule=Host(`simpay-back.simintermediacoes.com`)"
        - "traefik.http.routers.back-simpay.service=back-simpay"
        - "traefik.http.routers.back-simpay.tls=true"
        - "traefik.http.routers.back-simpay.tls.certresolver=le"
        - "traefik.http.services.back-simpay.loadbalancer.passHostHeader=true"
        - "traefik.http.services.back-simpay.loadbalancer.server.port=3333"

volumes:
  rabbitmq_data:
  simpay_storage:
    external: true
    name: back-simpay_simpay_storage

networks:
  externa:
    external: true
