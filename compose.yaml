name: simintpay-dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: simintpay
      POSTGRES_PASSWORD: local-development
    ports: ['127.0.0.1:5432:5432']
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d simintpay]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: simintpay
      RABBITMQ_DEFAULT_PASS: local-development
    ports: ['127.0.0.1:5672:5672', '127.0.0.1:15672:15672']
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 5s
      retries: 30
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres:
  rabbitmq:
