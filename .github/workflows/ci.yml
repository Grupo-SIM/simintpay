name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: echo "tasks=$(bun scripts/affected-packages.ts "$BASE_SHA" check-types build test:unit test:e2e)" >> "$GITHUB_OUTPUT"
  validate:
    needs: detect
    if: needs.detect.outputs.tasks != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        task: [check-types, build, test:unit, test:e2e]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install browser for affected frontend scenarios
        if: matrix.task == 'test:e2e' && contains(fromJSON(needs.detect.outputs.tasks)['test:e2e'], 'frontend')
        run: |
          bunx --no-install playwright-core install --with-deps chromium
          printf 'CHROME_PATH=%s\n' "$(find ~/.cache/ms-playwright -path '*/chrome-linux*/chrome' -type f | sort | tail -n 1)" >> "$GITHUB_ENV"
      - name: Run affected workspaces
        env:
          TASKS: ${{ needs.detect.outputs.tasks }}
          TASK: ${{ matrix.task }}
        run: bun scripts/run-affected.ts
